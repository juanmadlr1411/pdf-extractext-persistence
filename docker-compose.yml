services:
  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"

  pdf-extractext-persistence:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8002}:${APP_PORT:-8002}"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_PORT=${APP_PORT:-8002}
      - MONGO_URI=${COMPOSE_MONGO_URI:-mongodb://mongo:27017}
      - CONSUL_ENABLED=${CONSUL_ENABLED:-false}
    depends_on:
      - mongo